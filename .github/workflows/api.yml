name: API (App Service)

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Build & test (API)
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Hackathon-2025.Tests/Hackathon-2025.Tests.csproj

      - name: Build (warnings are errors in the API project)
        run: dotnet build Hackathon-2025.Tests/Hackathon-2025.Tests.csproj -c Release --no-restore

      - name: Test (includes SQL Server tests via Docker)
        run: dotnet test Hackathon-2025.Tests/Hackathon-2025.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

  # The frontend deploys from its own workflow; checking it here too means a frontend
  # failure also holds back the API, so prod never ends up with only one half updated.
  frontend-check:
    name: Lint & build (frontend)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Hackathon-2025/ClientApp/package-lock.json

      - name: Install deps
        working-directory: Hackathon-2025/ClientApp
        run: npm ci

      - name: Lint
        working-directory: Hackathon-2025/ClientApp
        run: npm run lint

      - name: Build (staging config)
        working-directory: Hackathon-2025/ClientApp
        run: npm run build:staging

  deploy-staging:
    name: API deploy (staging)
    needs: [test, frontend-check]
    if: ${{ github.event_name != 'pull_request' && github.ref_name == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      API_PROJECT: Hackathon-2025/Hackathon-2025.csproj   # <-- confirm path
      WEBAPP_NAME: starlitstories-api-dev                 # <-- exact staging App Service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "$API_PROJECT"

      - name: Publish
        run: dotnet publish "$API_PROJECT" -c Release -o publish /p:UseAppHost=false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: publish

  deploy-prod:
    name: API deploy (prod)
    needs: [test, frontend-check]
    if: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      API_PROJECT: Hackathon-2025/Hackathon-2025.csproj   # <-- confirm path
      WEBAPP_NAME: starlitstories-api-prod                # <-- exact prod App Service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "$API_PROJECT"

      - name: Publish
        run: dotnet publish "$API_PROJECT" -c Release -o publish /p:UseAppHost=false

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service (prod)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: publish
