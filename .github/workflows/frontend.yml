name: Frontend (SWA)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

jobs:
  # The API deploys from its own workflow; running its tests here too means an API failure
  # also holds back the frontend, so prod never ends up with only one half updated.
  api-test:
    name: Build & test (API)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check jobs never need write access or deploy credentials
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Hackathon-2025.Tests/Hackathon-2025.Tests.csproj

      - name: Build
        run: dotnet build Hackathon-2025.Tests/Hackathon-2025.Tests.csproj -c Release --no-restore

      - name: Test (includes SQL Server tests via Docker)
        run: dotnet test Hackathon-2025.Tests/Hackathon-2025.Tests.csproj -c Release --no-build

  verify:
    name: Lint & build (frontend)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check jobs never need write access or deploy credentials
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Hackathon-2025/ClientApp/package-lock.json

      - name: Install deps
        working-directory: Hackathon-2025/ClientApp
        run: npm ci

      - name: Lint
        working-directory: Hackathon-2025/ClientApp
        run: npm run lint

      - name: Build (staging config)
        working-directory: Hackathon-2025/ClientApp
        run: npm run build:staging

  deploy-staging:
    name: Frontend deploy (staging)
    needs: api-test
    if: ${{ github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Hackathon-2025/ClientApp/package-lock.json

      - name: Install deps
        working-directory: Hackathon-2025/ClientApp
        run: npm ci

      - name: Lint
        working-directory: Hackathon-2025/ClientApp
        run: npm run lint

      - name: Prepare robots.txt (staging)
        working-directory: Hackathon-2025/ClientApp
        run: |
          mkdir -p public
          cp robots.staging.txt public/robots.txt

      - name: Build (staging)
        working-directory: Hackathon-2025/ClientApp
        run: npm run build:staging

      - name: Copy SWA config (staging)
        working-directory: Hackathon-2025/ClientApp
        run: cp staticwebapp.staging.config.json dist/staticwebapp.config.json

      - name: Show dist contents (sanity)
        run: |
          ls -la Hackathon-2025/ClientApp/dist
          test -f Hackathon-2025/ClientApp/dist/index.html
          test -f Hackathon-2025/ClientApp/dist/robots.txt
          test -f Hackathon-2025/ClientApp/dist/staticwebapp.config.json

      - name: Deploy to Static Web Apps (staging)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: Hackathon-2025/ClientApp/dist
          skip_app_build: true
          skip_api_build: true

  deploy-prod:
    name: Frontend deploy (prod)
    needs: api-test
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Hackathon-2025/ClientApp/package-lock.json

      - name: Install deps
        working-directory: Hackathon-2025/ClientApp
        run: npm ci

      - name: Lint
        working-directory: Hackathon-2025/ClientApp
        run: npm run lint

      - name: Prepare robots.txt (prod)
        working-directory: Hackathon-2025/ClientApp
        run: |
          mkdir -p public
          cp robots.prod.txt public/robots.txt

      - name: Build (prod)
        working-directory: Hackathon-2025/ClientApp
        run: npm run build

      - name: Copy SWA config (prod)
        working-directory: Hackathon-2025/ClientApp
        run: cp staticwebapp.prod.config.json dist/staticwebapp.config.json

      - name: Show dist contents (sanity)
        run: |
          ls -la Hackathon-2025/ClientApp/dist
          test -f Hackathon-2025/ClientApp/dist/index.html
          test -f Hackathon-2025/ClientApp/dist/robots.txt
          test -f Hackathon-2025/ClientApp/dist/staticwebapp.config.json

      - name: Deploy to Static Web Apps (prod)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: Hackathon-2025/ClientApp/dist
          skip_app_build: true
          skip_api_build: true
